# Build, test and publish a HavenDOS release.
#
# Every push to main runs this, and it publishes when the version in
# include/version.h has no release yet -- so a version bump publishes,
# and a release whose build failed is retried by the next push that
# fixes it. When the release exists the run stops after a few seconds. Everything the release carries is
# built here from the committed source, so the ISO, the kernel in it and
# the source archive cannot describe three different trees.
#
# If release v<version> already exists the push run does nothing. Running
# the workflow by hand (Actions -> Release -> Run workflow) rebuilds the
# current version and replaces its files, which is how a broken upload is
# repaired.
#
# The tests are a gate, not decoration: a red tree is not published.
# Somebody other than Kyan updates their laptop from these files.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Which version is this
        id: v
        run: |
          ver=$(sed -n 's/^#define[[:space:]]\+HAVENDOS_VER_NUM[[:space:]]\+"\([^"]*\)".*/\1/p' include/version.h)
          [ -n "$ver" ] || { echo "::error::no HAVENDOS_VER_NUM in include/version.h"; exit 1; }
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          # v0.9.7: the tag, the ISO's name, the title and whether it is a
          # pre-release all come from tools/release_names.py (THS-RM-1004
          # s.9-11): v0.9.7 now, 27100.1000 and HavenDOS-1-27H1.iso from
          # HavenDOS 1. Everything below Stable is a pre-release.
          python3 tools/release_names.py --selftest >/dev/null
          eval "$(python3 tools/release_names.py include/version.h)"
          { echo "tag=$TAG"; echo "iso=$ISO"; echo "title=$TITLE"; echo "pre=$PRERELEASE"; } >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi
          if [ ! -f "changelogs/CHANGELOG-v$ver.md" ]; then
            echo "::error::changelogs/CHANGELOG-v$ver.md is missing -- write it before bumping the version"
            exit 1
          fi
          echo "$TITLE  (tag $TAG, $ISO, pre-release: $PRERELEASE)"

      - name: Already published
        if: steps.v.outputs.exists == '1' && github.event_name == 'push'
        run: echo "${{ steps.v.outputs.tag }} is already a release; nothing to do. Run the workflow by hand to rebuild it."

      - name: Toolchain
        if: steps.v.outputs.exists == '0' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq
          # grub-pc-bin AND grub-efi-amd64-bin: without the first the ISO
          # gets no BIOS boot image, which shipped silently once.
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-multilib make python3 python3-pip \
            grub-common grub-pc-bin grub-efi-amd64-bin xorriso mtools \
            dosfstools exfatprogs exfat-fuse fuse3 gdisk openssl zip unzip \
            gcc-mingw-w64-x86-64 libx11-dev
          sudo pip3 install --break-system-packages -q hid-parser

      # Built and tested as root: the exFAT fixture needs losetup and a FUSE
      # mount, and that is how every release so far has been verified.
      - name: Build
        if: steps.v.outputs.exists == '0' || github.event_name == 'workflow_dispatch'
        run: |
          # Serially after the two kernels: -j lets version-sync run its
          # checks before havendos.elf exists.
          sudo make havendos_pass1.elf -j"$(nproc)"
          sudo make havendos.elf -j"$(nproc)"
          sudo make all
          # v0.9.7.5: Retro PC as a program -- RetroPC.exe (mingw-w64,
          # static) and the Linux build, packaged for the release
          sudo make retropc

      - name: Test
        if: steps.v.outputs.exists == '0' || github.event_name == 'workflow_dispatch'
        run: sudo make test

      - name: Bundle
        if: steps.v.outputs.exists == '0' || github.event_name == 'workflow_dispatch'
        run: sudo python3 tools/make_release_bundle.py

      - name: Publish
        if: steps.v.outputs.exists == '0' || github.event_name == 'workflow_dispatch'
        run: |
          ver="${{ steps.v.outputs.ver }}"
          tag="${{ steps.v.outputs.tag }}"
          iso="${{ steps.v.outputs.iso }}"
          title="${{ steps.v.outputs.title }}"
          pre="${{ steps.v.outputs.pre }}"
          stage="dist/HavenDOS-$ver"
          # the build names its ISO after VER_NUM; from HavenDOS 1 the
          # release's own name differs (HavenDOS-1-27H1.iso)
          [ "HavenDOS-$ver.iso" = "$iso" ] || cp -f "HavenDOS-$ver.iso" "$iso"
          notes=$(mktemp)
          {
            echo "**Which file do I want?**"
            echo ""
            echo "| File | For |"
            echo "|---|---|"
            echo "| \`$iso\` | Booting or installing -- BIOS and UEFI, Secure Boot off |"
            echo "| \`HavenDOS-$ver-bundle.zip\` | Updating an installed system: the kernel, \`update.inf\` and the Windows/Linux staging scripts, plus the ISO, handoff and hardware-test docs |"
            echo "| \`HavenDOS-$ver-source.zip\` | Building it yourself -- \`make && make test\` |"
            echo "| \`RetroPC-$ver-windows.zip\` | Retro PC on Windows: one \`RetroPC.exe\`, nothing to install |"
            echo "| \`RetroPC-$ver-linux-x86_64.tar.gz\` | Retro PC on Linux: \`retropc\` (X11) and \`retropc-headless\` |"
            echo ""
            echo "---"
            echo ""
            cat "changelogs/CHANGELOG-v$ver.md"
          } > "$notes"
          files=("$iso" "$stage/HavenDOS-$ver-source.zip" "dist/HavenDOS-$ver-bundle.zip" \
                 "dist/RetroPC-$ver-windows.zip" "dist/RetroPC-$ver-linux-x86_64.tar.gz")
          for f in "${files[@]}"; do [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }; done
          preflag=(); [ "$pre" = "true" ] && preflag=(--prerelease)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --notes-file "$notes" "${preflag[@]}"
          else
            gh release create "$tag" "${files[@]}" "${preflag[@]}" \
              --title "$title" --notes-file "$notes" --target "$GITHUB_SHA"
          fi
          gh release view "$tag" --json url,assets --jq '.url, (.assets[] | "  \(.name)  \(.size)")'
