# GENERATED by tools/make_isodir.py because this tree had no isodir/.
#
# The entries and their ORDER are not arbitrary. kernel/main.c's
# apply_cmdline() defines what each argument does, and three harnesses
# count on the order:
#
#   index 0  normal boot
#   index 1  shell mode      harness/fat32_boot.py SHELL_MODE_INDEX = 1
#   index 2  safe mode
#   index 3  install         harness/uefi_dualboot.py MENU_INSTALL = 3
#
# Replace this file with your own and this script will leave it alone.

# HavenDOS renders through a framebuffer console, and it gets that
# framebuffer from the mode GRUB sets before handing over -- Multiboot1
# VBE fields, which is why gfxpayload=keep matters here and not just for
# GRUB's own menu. Without all_video loaded and a gfxmode it can actually
# satisfy, GRUB stops at
#
#     error: no suitable video mode found.
#
# which is what a generated menu with no video setup in it does under
# OVMF. Found by booting one.
insmod all_video
insmod gfxterm
# v0.9.0 CORRECTION. The paragraph that was here said this list is
# what decides the kernel's resolution. It is not, and that was worth
# finding out: GRUB honours the mode requested in the kernel's OWN
# multiboot header (boot/boot.S, FB_WIDTH/FB_HEIGHT) ABOVE gfxmode and
# gfxpayload. This list styles GRUB's menu and stops there.
#
# Measured, not reasoned: with the list forced to 1920x1080 the kernel
# still came up on a 1280x800 framebuffer, which is what boot.S asks
# for. Setting the header to "no preference" made GRUB use "auto"
# instead of this list, and that gave 800x600 -- worse.
#
# The list is kept because GRUB's menu is more legible on a native
# mode, and because it costs nothing. It is NOT the fix for the 64x24
# console; boot/boot.S explains what actually caused that.
set gfxmode=1920x1080,1600x900,1440x900,1366x768,1280x800,1024x768,800x600,640x480,auto
set gfxpayload=keep
terminal_output gfxterm

# The timeout has to outlast the harnesses. They sleep through OVMF's
# slow start before touching the menu -- harness/uefi_dualboot.py waits 12
# seconds, harness/esp_update.py waits 26 -- and a menu that has already
# counted down and booted the default by then cannot be driven at all.
# Found by running uefi_dualboot.py against a generated isodir with
# timeout=10: every installer check failed because the install never
# started.
set timeout=60
set default=0

menuentry "HavenDOS v0.9.0" {
    multiboot /boot/havendos.elf mode=desktop gfx=text live
    boot
}

menuentry "HavenDOS v0.9.0 -- Shell Mode" {
    multiboot /boot/havendos.elf mode=shell gfx=text live
    boot
}

menuentry "HavenDOS v0.9.0 -- Safe Mode" {
    multiboot /boot/havendos.elf mode=safe gfx=text live
    boot
}

menuentry "HavenDOS v0.9.0 -- Install to Disk" {
    multiboot /boot/havendos.elf install=1 gfx=text
    boot
}

# Entry 4, AFTER the four the harnesses index, so their counting is
# unaffected. This one deliberately does NOT pass `live`.
#
# `live` means what kernel/main.c says it means: no disk probed, no disk
# mounted, RAM only. That is right for an install medium and wrong for
# this job, because `update` begins by requiring fat16_detected() -- it
# writes the new kernel to the HavenDOS partition that is already on the
# disk. A live shell cannot see that partition and refuses with "No FAT16
# partition found".
#
# So: boot this, type `update`, and the kernel staged on the EFI System
# Partition replaces /boot/havendos.elf in place. Nothing is
# repartitioned, the GPT is not touched, and the firmware boot entry that
# is already there keeps working.
menuentry "HavenDOS v0.9.0 -- Update installed system from the ESP" {
    multiboot /boot/havendos.elf mode=shell gfx=text
    boot
}

# ── Entries 5 and 6: the escape hatch (v0.9.0) ─────────────────────
#
# `nousbkbd` turns OUR USB HID input off and leaves the firmware's USB
# legacy emulation -- the SMM handler that presents a USB keyboard at
# ports 0x60/0x64 -- to do the typing, exactly as it did before any of
# the USB work existed.
#
# It is here because the release before this one never took the
# controller from the BIOS. The firmware kept emulating while the kernel
# also drove the xHCI, so every keystroke arrived twice and the installer
# could not be driven. This release performs the handoff, which should
# make these entries unnecessary -- but a firmware that refuses to let go
# is a thing that happens, and on a laptop with no PS/2 port the
# difference between one keyboard and none is the difference between
# installable and not.
#
# No version number is written in this comment on purpose:
# tools/make_version.py rewrites every version string in this file,
# comments included, and turned an accurate sentence into a false one.
#
# If keys still double on the normal entries, use these.
menuentry "HavenDOS v0.9.0 -- Install to Disk (firmware keyboard)" {
    multiboot /boot/havendos.elf install=1 gfx=text nousbkbd
    boot
}

menuentry "HavenDOS v0.9.0 -- Shell Mode (firmware keyboard)" {
    multiboot /boot/havendos.elf mode=shell gfx=text live nousbkbd
    boot
}

# ── Entry 7: the keyboard diagnostic ─────────────────────────────────
#
# `kbddiag` prints every byte read out of the 8042 and says whether the
# interrupt handler or the polling path read it. Boot this, press a few
# keys, and photograph the screen.
#
# Two scancodes per keypress means the firmware is sending each key
# twice. The same scancode twice, or one from "irq" and one from "poll",
# means it is being READ twice -- which is what this release fixes.
menuentry "HavenDOS -- Shell Mode (keyboard diagnostic)" {
    multiboot /boot/havendos.elf mode=shell gfx=text live kbddiag
    boot
}
