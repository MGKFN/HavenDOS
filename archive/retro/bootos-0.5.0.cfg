set timeout=10
set default=0

insmod all_video
insmod vbe
insmod vga

# ── iPad / UTM SE ─────────────────────────────────────────────
menuentry "BOOT OS v0.5.0  |  iPad / UTM SE  [Text Desktop]" {
    multiboot /boot/bootos.elf mode=desktop gfx=text
    boot
}

menuentry "BOOT OS v0.5.0  |  iPad / UTM SE  [Mode13h - flip X]" {
    multiboot /boot/bootos.elf mode=desktop gfx=mode13 flip=x
    boot
}

menuentry "BOOT OS v0.5.0  |  iPad / UTM SE  [Mode13h - Normal]" {
    multiboot /boot/bootos.elf mode=desktop gfx=mode13
    boot
}

menuentry "BOOT OS v0.5.0  |  iPad / UTM SE  [Mode13h - flip Y]" {
    multiboot /boot/bootos.elf mode=desktop gfx=mode13 flip=y
    boot
}

menuentry "BOOT OS v0.5.0  |  iPad / UTM SE  [Mode13h - flip XY]" {
    multiboot /boot/bootos.elf mode=desktop gfx=mode13 flip=xy
    boot
}

# ── PC / QEMU ─────────────────────────────────────────────────
menuentry "BOOT OS v0.5.0  |  PC / QEMU  [Mode13h]" {
    multiboot /boot/bootos.elf mode=desktop gfx=mode13
    boot
}

menuentry "BOOT OS v0.5.0  |  Shell Mode" {
    multiboot /boot/bootos.elf mode=shell gfx=text
    boot
}

menuentry "BOOT OS v0.5.0  |  Safe Mode  [no mouse]" {
    multiboot /boot/bootos.elf mode=safe gfx=text
    boot
}
