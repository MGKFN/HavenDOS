set timeout=30
set default=0

insmod all_video
insmod vbe
insmod vga
insmod gfxterm
insmod font
insmod png

# Low resolution so text is large and readable on any screen
set gfxmode=800x600x32,640x480x32,auto
terminal_output gfxterm

# Load the large font first — used by the theme and fallback colors
loadfont /boot/grub/havendos24.pf2

# Theme gives us the gray background, big menu items, progress bar
set theme=/boot/grub/themes/havendos/theme.txt

menuentry "  HavenDOS v0.7.4  --  Desktop" {
    multiboot /boot/havendos.elf mode=desktop gfx=text
    boot
}

menuentry "  HavenDOS v0.7.4  --  Shell Mode" {
    multiboot /boot/havendos.elf mode=shell gfx=text
    boot
}

menuentry "  HavenDOS v0.7.4  --  Safe Mode  (no mouse)" {
    multiboot /boot/havendos.elf mode=safe gfx=text
    boot
}

menuentry "  HavenDOS v0.7.4  --  Install to Disk" {
    multiboot /boot/havendos.elf mode=desktop gfx=text install=1
    boot
}
